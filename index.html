<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient SOS Portal</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      background-color: #f3e5f5;
      text-align: center;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 500px;
      margin: 0 auto;
      border-top: 6px solid #6a1b9a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .sos-btn {
      width: 100%;
      height: 140px;
      background: linear-gradient(135deg, #00e676, #00a152);
      color: white;
      border: none;
      border-radius: 70px;
      font-size: 32px;
      font-weight: 800;
      cursor: pointer;
      margin: 20px 0;
      box-shadow: 0 8px 20px rgba(0, 230, 118, 0.4);
    }
    .sos-btn:active {
      transform: scale(0.98);
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      margin-bottom: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
    }
    label {
      display: block;
      text-align: left;
      font-weight: bold;
      color: #4a148c;
    }
  </style>
</head>
<body>

<div class="card">
  <h2 style="color: #6a1b9a; margin-top: 0;">📱 Patient Emergency Portal</h2>
  
  <button class="sos-btn" onclick="sendSOS()">TRIGGER SOS</button>

  <label>Patient Name:</label>
  <input type="text" id="patient-name" placeholder="John Doe">

  <label>Emergency Details:</label>
  <textarea id="patient-details" rows="3" placeholder="Severe chest pain / Blood type O+"></textarea>
</div>

<script>
  const firebaseConfig = {
    databaseURL: "https://sos-system-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  function sendSOS() {
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => pushData(pos.coords.latitude, pos.coords.longitude),
        () => pushData(null, null)
      );
    } else {
      pushData(null, null);
    }
  }

  function pushData(lat, lng) {
    const payload = {
      timestamp: new Date().toLocaleTimeString(),
      name: document.getElementById('patient-name').value || "Unknown Patient",
      details: document.getElementById('patient-details').value || "No details provided",
      lat: lat,
      lng: lng
    };

    database.ref('emergencies').push(payload)
      .then(() => {
        alert("🚨 SOS Signal Sent to Hospital!");
      })
      .catch((err) => {
        alert("Error sending SOS: " + err.message);
      });
  }
</script>

</body>
</html>
